# Runs the job pipeline twice a day: fetch -> filter -> score -> Google
# Sheet. Replaces the old VPS cron job. Settings come from repository
# secrets and variables (Settings > Secrets and variables > Actions); see
# README "Daily run on GitHub Actions". The SMTP secrets are optional: set
# them only if you want the daily digest email.
name: Daily pipeline

on:
  schedule:
    # 13:00 and 21:00 UTC = 8 AM and 4 PM Toronto in winter (EST), 9 AM and
    # 5 PM in summer (EDT). GitHub schedules are UTC only and may start a few
    # minutes late.
    - cron: "0 13,21 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test "tests/*.test.mjs"
      - name: Run pipeline
        run: node scripts/run-pipeline.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB || 'Sheet1' }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          DIGEST_RECIPIENT_EMAIL: ${{ secrets.DIGEST_RECIPIENT_EMAIL }}
          MINIMUM_MATCH_SCORE: ${{ vars.MINIMUM_MATCH_SCORE || '55' }}
          AUTO_APPROVE_MIN_SCORE: ${{ vars.AUTO_APPROVE_MIN_SCORE || '80' }}
          REQUIRE_REMOTE: ${{ vars.REQUIRE_REMOTE || 'false' }}

  # GitHub turns off scheduled workflows in a public repo after 60 days
  # without a commit, and this pipeline never commits. Re-enabling the
  # workflow through the API resets that timer, so the schedule never lapses.
  # Separate job: it runs even when the pipeline job fails.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reset the inactivity timer
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-pipeline.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
